services:
  officejoker:
    image: ghcr.io/officejoker/officejoker:latest
    container_name: officejoker
    restart: unless-stopped
    ports:
      - "7864:7864"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # 可选：把 config.json 放到同级目录再挂进去（不挂则用默认配置，首次启动自动生成）
      # - ./config.json:/app/config.json:ro
    environment:
      # API Key（多个用逗号分隔）；不设则用 config.json 里的
      # OFFICEJOKER_KEYS: "sk-your-key"
      # 上游直连模式
      # OFFICEJOKER_BASE_URL: "https://your-upstream.example.com"
      # OFFICEJOKER_AUTHORIZATION: "Bearer xxx"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7864/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
